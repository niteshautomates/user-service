apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8
          env:
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:   
                name: mysql-secret
                key: MYSQL_ROOT_PASSWORD
          - name: MYSQL_DATABASE
            valueFrom:
              configMapKeyRef:
                name: mysql-config
                key: MYSQL_DATABASE
            ports:
            - containerPort: 3306
            volumeMounts:
            - mounPath: /var/lib/mysql
              name: mysql-data
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "1Gi"
                cpu:    "1"
      volumes:
      - name: mysql-data
        persistenceVolumeClaim:
          claimName: pvc      
