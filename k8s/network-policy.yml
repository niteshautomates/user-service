apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-network-policy
  namespace: hotel-ratings
  spec:
    podSelector:
      matchLabels:
        app: user-service
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app: user-service
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - podSelector:
              matchLabels:
                app: mysql
        ports:
          - protocol: TCP
            port: 3306